{% extends "base.html" %}
{% block titulo %}{{ codigo }}{% endblock %}
{% block contenido %}
<section class="vacio-grande">
    <div class="vacio-grande__codigo {{ 'rojo' if codigo == 403 }}">{{ codigo }}</div>
    <h1>{{ titulo }}</h1>
    <p class="sub">{{ detalle }}</p>
    <a class="boton" href="{{ url_for('auth.inicio') }}">Volver al panel</a>
</section>
{% endblock %}
